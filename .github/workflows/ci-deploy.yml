name: qa-hub frontend CI/CD

# Nhánh này chỉ chứa frontend (dashboard Next.js). Backend có CI riêng ở nhánh `backend`
# của cùng repo.

on:
  push:
    branches: [frontend]
  pull_request:
    branches: [frontend]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type-check + build
        env:
          # Placeholder chỉ để build pass trong CI — giá trị thật được bake lại lúc build image
          # ở job deploy, trỏ vào URL thật của backend đã deploy (nhánh `backend`).
          NEXT_PUBLIC_API_BASE_URL: http://localhost:9090
        run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/frontend' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy qua SSH (docker compose up -d --build trên VPS)
        # Cần cấu hình trước trong Settings > Secrets/Variables của repo: DEPLOY_HOST, DEPLOY_USER,
        # DEPLOY_SSH_KEY, DEPLOY_PATH (thư mục chứa checkout nhánh `frontend` trên VPS),
        # QAHUB_API_PUBLIC_URL (vars, URL thật của backend đã deploy). Bỏ qua job này (không set
        # vars.DEPLOY_ENABLED) nếu chưa muốn deploy tự động — build vẫn chạy bình thường.
        if: vars.DEPLOY_ENABLED == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            QAHUB_API_PUBLIC_URL=${{ vars.QAHUB_API_PUBLIC_URL }} docker compose up -d --build
