# Deploy BACKEND của qa-hub (chỉ api — KHÔNG bundle MySQL). Nhánh này KHÔNG chứa frontend.
# Frontend (dashboard Next.js) nằm ở nhánh `frontend` của CÙNG repo
# (github.com/nghiafullstack/qa_hub) — deploy độc lập, tự có docker-compose.yml riêng ở đó,
# chỉ cần biết URL public của api chạy từ file compose này.
#
# MySQL chạy trên 1 server riêng bên ngoài (không phải container do compose này quản lý) — tự
# tạo database/schema rỗng (tên khớp DB_DATABASE bên dưới) + user có đủ quyền trước khi chạy
# `docker compose up`. Flyway (`V1__init_schema.sql`) sẽ tự tạo bảng vào lần khởi động API đầu
# tiên — không cần chạy SQL tay, chỉ cần schema rỗng đã tồn tại.
#
# TÁCH BIỆT HOÀN TOÀN khỏi rencity-platform-spring/infra/docker-compose.yml — không dùng chung
# port/DB với Rencity. Dải cổng 8180-8186 đã bị Rencity chiếm — dùng 9090 cho api.
#
# Chạy: copy .env.example -> .env, điền DB_HOST/DB_PORT trỏ vào MySQL server ngoài của bạn +
# QAHUB_JWT_SECRET/QAHUB_ADMIN_*/GEMINI_* (dùng lại key Rencity, xem README)/QAHUB_GITHUB_TOKEN
# (nếu cần)/QAHUB_WEB_ORIGIN, rồi `docker compose up -d --build`.

name: qa-hub-backend

services:
  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      SERVER_PORT: 9090
      DB_HOST: ${DB_HOST:?bắt buộc set trong .env — host MySQL server ngoài của bạn}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-qa_hub}
      DB_USERNAME: ${DB_USERNAME:?bắt buộc set trong .env}
      DB_PASSWORD: ${DB_PASSWORD:?bắt buộc set trong .env}
      QAHUB_JWT_SECRET: ${QAHUB_JWT_SECRET:?bắt buộc set trong .env — không dùng giá trị mặc định lúc deploy thật}
      QAHUB_ADMIN_EMAIL: ${QAHUB_ADMIN_EMAIL:-admin@qahub.local}
      QAHUB_ADMIN_PASSWORD: ${QAHUB_ADMIN_PASSWORD:?bắt buộc set trong .env}
      QAHUB_GITHUB_TOKEN: ${QAHUB_GITHUB_TOKEN:-}
      QAHUB_WEB_ORIGIN: ${QAHUB_WEB_ORIGIN:-http://localhost:9091}
      # Dùng lại đúng biến GEMINI_* của module AI Chatbot bên rencity-platform-spring — xem README.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-180000}
      GEMINI_THINKING_LEVEL_ANALYSIS: ${GEMINI_THINKING_LEVEL_ANALYSIS:-minimal}
      GEMINI_ANALYSIS_MAX_OUTPUT_TOKENS: ${GEMINI_ANALYSIS_MAX_OUTPUT_TOKENS:-3072}
      GEMINI_TIMEOUT_RETRIES: ${GEMINI_TIMEOUT_RETRIES:-1}
    ports:
      - "9090:9090"
